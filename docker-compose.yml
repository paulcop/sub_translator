services:
  sub-translator:
    build: .
    image: sub-translator:latest
    container_name: sub-translator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_MB: "20000"
    # Aucun volume : rien n'est persisté. Le système de fichiers est en lecture
    # seule, seul /tmp est inscriptible, et il vit en RAM (tmpfs).
    # /tmp ne sert qu'aux MP4 (index en fin de fichier) le temps de l'extraction.
    read_only: true
    tmpfs:
      - /tmp:size=8g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
